<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Script Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/blockly/blockly.min.js"></script>
<style>
  :root{
    --bg-app:     #F4F5F7;
    --bg-panel:   #FFFFFF;
    --line:       #E2E4EA;
    --text-hi:    #14151A;
    --text-mid:   #585C66;
    --text-dim:   #9296A1;
    --indigo:     #4F46E5;
    --indigo-soft:#EEF0FF;
    --coral:      #FF5A36;
    --coral-soft: #FFEDE8;
    --radius:     8px;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg-app);
    color:var(--text-hi);
    font-family:'Inter',system-ui,sans-serif;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ── ヘッダー（フラット） ── */
  header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 22px;
    background:var(--bg-panel);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .mark{
    width:32px; height:32px; border-radius:7px;
    background:var(--indigo);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px;
    color:#fff;
    flex-shrink:0;
  }
  .title-block h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:16px; font-weight:600; letter-spacing:.01em;
    margin:0; line-height:1.2; color:var(--text-hi);
  }
  .title-block p{
    margin:2px 0 0; font-size:12px; color:var(--text-dim);
  }
  .flow{
    margin-left:auto;
    display:flex; align-items:center; gap:6px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-mid);
  }
  .flow span.node{
    padding:4px 10px; border-radius:999px; background:var(--indigo-soft); color:var(--indigo);
  }
  .flow .wire{ width:16px; height:1px; background:var(--line); }

  /* ── ツールバー ── */
  .toolbar{
    display:flex; align-items:center; gap:10px;
    padding:10px 22px; background:var(--bg-panel);
    border-bottom:1px solid var(--line);
    flex-shrink:0; flex-wrap:wrap;
  }
  .toolbar label{ font-size:12px; color:var(--text-dim); margin-right:-4px; }
  .toolbar input[type=text]{
    background:var(--bg-app); border:1px solid var(--line); color:var(--text-hi);
    border-radius:6px; padding:8px 10px; font-size:13px; font-family:'IBM Plex Mono',monospace;
    min-width:200px;
  }
  .toolbar input[type=text]:focus{ outline:2px solid var(--indigo); outline-offset:1px; border-color:var(--indigo); }
  .toolbar input[type=file]{ display:none; }

  button{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    border:1px solid var(--line); background:var(--bg-panel); color:var(--text-hi);
    padding:8px 14px; border-radius:6px; cursor:pointer;
    transition:background .12s ease, border-color .12s ease;
  }
  button:hover{ background:var(--bg-app); }
  button:active{ transform:translateY(1px); }
  button:focus-visible{ outline:2px solid var(--indigo); outline-offset:2px; }

  .btn-primary{
    background:var(--coral);
    border-color:var(--coral); color:#fff;
  }
  .btn-primary:hover{ background:#E64F2D; border-color:#E64F2D; }

  .spacer{ flex:1; }

  /* ── ワークスペース（フラット） ── */
  #workspace-wrap{ position:relative; flex:1; min-height:0; padding:12px; }
  #blockly-div{
    position:absolute; inset:12px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(16px);
    background:var(--text-hi); color:#fff;
    padding:10px 16px; border-radius:8px; font-size:13px;
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    display:flex; align-items:center; gap:8px;
    z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast .dot{ width:6px; height:6px; border-radius:50%; background:#7FDDA0; flex-shrink:0; }
  .toast.err .dot{ background:#FF9C9C; }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:#D4D7E0; border-radius:5px; }
</style>
</head>
<body>

<header>
  <div class="mark">⌁</div>
  <div class="title-block">
    <h1>Script Builder</h1>
  </div>
  <div class="flow" aria-hidden="true">
    <span class="node">トリガー</span><span class="wire"></span>
    <span class="node">条件</span><span class="wire"></span>
    <span class="node">アクション</span>
  </div>
</header>

<div class="toolbar">
  <label for="scriptName">スクリプト名</label>
  <input type="text" id="scriptName" value="サンプルスクリプト" maxlength="50">

  <span class="spacer"></span>

  <button id="btnLoad">📂 読み込み</button>
  <input type="file" id="fileInput" accept="application/json">
  <button id="btnClear">🗑 クリア</button>
  <button id="btnDownload" class="btn-primary">⬇ スクリプトをダウンロード (.json)</button>
</div>

<div id="workspace-wrap">
  <div id="blockly-div"></div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastMsg"></span></div>

<!-- ══════════════════════════════════════════════
     ブロック定義
     Bot側スキーマ: { version, name, trigger:{type,...}, actions:[...] }
     旧バージョン（trigger.type="on_message"のみ・旧アクション集合のみ）のスクリプトも
     そのままロード・実行できるよう、新フィールドは全て省略可能にしてある。
     ══════════════════════════════════════════════ -->
<script>
const CONDITION_OPTIONS = [
  ["条件なし（常に反応）","any"],
  ["完全一致 =","equals"],
  ["含む",       "contains"],
  ["で始まる",    "startswith"],
  ["で終わる",    "endswith"],
];
const BOOL_OPTIONS = [["ON","true"],["OFF","false"]];

const COLOUR_TRIGGER = '#10B981';
const TEMPLATE_HINT = ' 差し込み変数が使えます: {user} {user.name} {server} {channel} {member_count} {mention:ID} {role:ID} {random:A|B|C}';
const COLOUR_ACTION  = '#4F46E5';
const COLOUR_VOICE   = '#0EA5E9';
const COLOUR_MOD     = '#EF4444';
const COLOUR_FUN     = '#EC4899';

/* ── トリガー ── */
Blockly.Blocks['trigger_on_message'] = {
  init: function() {
    this.appendDummyInput().appendField('⚡ メッセージを受信したとき');
    this.appendValueInput('CHANNEL_ID').setCheck(null)
        .appendField('  対象チャンネルID(任意)');
    this.appendDummyInput()
        .appendField('  条件')
        .appendField(new Blockly.FieldDropdown(CONDITION_OPTIONS), 'COND_TYPE')
        .appendField(new Blockly.FieldTextInput(''), 'COND_VALUE');
    this.appendStatementInput('ACTIONS').setCheck('action').appendField('▼ 実行するアクション');
    this.setColour(COLOUR_TRIGGER);
    this.setTooltip('メッセージを受信した時に発動します。チャンネルIDと条件を空にすると全チャンネル・無条件で反応します。');
  }
};

Blockly.Blocks['trigger_on_member_join'] = {
  init: function() {
    this.appendDummyInput().appendField('🚪 メンバーが参加したとき');
    this.appendDummyInput()
        .appendField('  実行先チャンネルID')
        .appendField(new Blockly.FieldTextInput('000000000000000000'), 'CHANNEL_ID');
    this.appendStatementInput('ACTIONS').setCheck('action').appendField('▼ 実行するアクション');
    this.setColour(COLOUR_TRIGGER);
    this.setTooltip('新しいメンバーがサーバーに参加した時に発動します。メッセージが存在しないため実行先チャンネルの指定が必須です。');
  }
};

Blockly.Blocks['trigger_on_member_leave'] = {
  init: function() {
    this.appendDummyInput().appendField('🚶 メンバーが退出したとき');
    this.appendDummyInput()
        .appendField('  実行先チャンネルID')
        .appendField(new Blockly.FieldTextInput('000000000000000000'), 'CHANNEL_ID');
    this.appendStatementInput('ACTIONS').setCheck('action').appendField('▼ 実行するアクション');
    this.setColour(COLOUR_TRIGGER);
    this.setTooltip('メンバーがサーバーから退出した時に発動します。実行先チャンネルの指定が必須です。');
  }
};

Blockly.Blocks['trigger_on_reaction_add'] = {
  init: function() {
    this.appendDummyInput().appendField('😀 リアクションが付いたとき');
    this.appendValueInput('CHANNEL_ID').setCheck(null)
        .appendField('  対象チャンネルID(任意)');
    this.appendDummyInput()
        .appendField('  絵文字条件')
        .appendField(new Blockly.FieldDropdown(CONDITION_OPTIONS), 'COND_TYPE')
        .appendField(new Blockly.FieldTextInput('👍'), 'COND_VALUE');
    this.appendStatementInput('ACTIONS').setCheck('action').appendField('▼ 実行するアクション');
    this.setColour(COLOUR_TRIGGER);
    this.setTooltip('メッセージにリアクションが付いた時に発動します。絵文字条件は「完全一致」で特定の絵文字だけに絞り込めます。');
  }
};

Blockly.Blocks['trigger_on_voice_join'] = {
  init: function() {
    this.appendDummyInput().appendField('🔊 VCに参加したとき');
    this.appendDummyInput()
        .appendField('  対象VCのID(任意・絞り込み)')
        .appendField(new Blockly.FieldTextInput(''), 'VOICE_CHANNEL_ID');
    this.appendDummyInput()
        .appendField('  実行先チャンネルID')
        .appendField(new Blockly.FieldTextInput('000000000000000000'), 'CHANNEL_ID');
    this.appendStatementInput('ACTIONS').setCheck('action').appendField('▼ 実行するアクション');
    this.setColour(COLOUR_TRIGGER);
    this.setTooltip('メンバーがボイスチャンネルに参加した時に発動します。VCのIDを指定すると特定のVCのみに絞り込めます。');
  }
};

Blockly.Blocks['trigger_on_voice_leave'] = {
  init: function() {
    this.appendDummyInput().appendField('🔈 VCから退出したとき');
    this.appendDummyInput()
        .appendField('  対象VCのID(任意・絞り込み)')
        .appendField(new Blockly.FieldTextInput(''), 'VOICE_CHANNEL_ID');
    this.appendDummyInput()
        .appendField('  実行先チャンネルID')
        .appendField(new Blockly.FieldTextInput('000000000000000000'), 'CHANNEL_ID');
    this.appendStatementInput('ACTIONS').setCheck('action').appendField('▼ 実行するアクション');
    this.setColour(COLOUR_TRIGGER);
    this.setTooltip('メンバーがボイスチャンネルから退出した時に発動します。');
  }
};

Blockly.Blocks['value_channel_id'] = {
  init: function() {
    this.appendDummyInput().appendField(new Blockly.FieldTextInput(''), 'ID');
    this.setOutput(true, null);
    this.setColour(COLOUR_TRIGGER);
    this.setTooltip('チャンネルIDを数字で入力（空欄=絞り込みなし）。');
  }
};

const TRIGGER_TYPES = [
  ['trigger_on_message', '⚡ メッセージ受信'],
  ['trigger_on_member_join', '🚪 メンバー参加'],
  ['trigger_on_member_leave', '🚶 メンバー退出'],
  ['trigger_on_reaction_add', '😀 リアクション追加'],
  ['trigger_on_voice_join', '🔊 VC参加'],
  ['trigger_on_voice_leave', '🔈 VC退出'],
];

function defineActionBlock(type, colour, tooltip, initFn) {
  Blockly.Blocks[type] = {
    init: function() {
      initFn.call(this);
      this.setPreviousStatement(true, 'action');
      this.setNextStatement(true, 'action');
      this.setColour(colour);
      this.setTooltip(tooltip);
    }
  };
}

/* ── 待機 ── */
defineActionBlock('action_delay', COLOUR_ACTION, '指定ミリ秒だけ待機してから次のアクションに進みます。', function() {
  this.appendDummyInput()
      .appendField('⏱ 待機')
      .appendField(new Blockly.FieldNumber(1000, 0, 3600000, 1), 'MS')
      .appendField('ミリ秒（最大3600000=1時間）');
});
defineActionBlock('action_random_delay', COLOUR_ACTION, 'min〜maxミリ秒の範囲でランダムに待機します。', function() {
  this.appendDummyInput()
      .appendField('🎲 ランダム待機')
      .appendField(new Blockly.FieldNumber(500, 0, 3600000, 1), 'MIN_MS')
      .appendField('〜')
      .appendField(new Blockly.FieldNumber(2000, 0, 3600000, 1), 'MAX_MS')
      .appendField('ミリ秒');
});

/* ── メッセージ ── */
defineActionBlock('action_send_message', COLOUR_ACTION, 'トリガーの実行先チャンネルにメッセージを送信します（最大2000文字）。' + TEMPLATE_HINT, function() {
  this.appendDummyInput()
      .appendField('💬 メッセージ送信')
      .appendField(new Blockly.FieldTextInput('hi'), 'CONTENT');
});
defineActionBlock('action_reply', COLOUR_ACTION, 'トリガーとなったメッセージに返信します（メッセージ受信/リアクショントリガーのみ有効）。' + TEMPLATE_HINT, function() {
  this.appendDummyInput()
      .appendField('↩ 返信')
      .appendField(new Blockly.FieldTextInput('hi'), 'CONTENT');
});
defineActionBlock('action_random_message', COLOUR_ACTION, '複数候補からランダムに1つ選んで送信します。「|」区切りで複数入力してください（最大10個）。' + TEMPLATE_HINT, function() {
  this.appendDummyInput()
      .appendField('🔀 ランダムメッセージ送信')
      .appendField(new Blockly.FieldTextInput('おはよう|こんにちは|こんばんは'), 'MESSAGES');
});
defineActionBlock('action_send_embed', COLOUR_ACTION, 'タイトル・説明・色を指定してEmbedを送信します（タイトルか説明のどちらかは必須）。' + TEMPLATE_HINT, function() {
  this.appendDummyInput().appendField('🖼 Embed送信');
  this.appendDummyInput()
      .appendField('  タイトル')
      .appendField(new Blockly.FieldTextInput(''), 'TITLE');
  this.appendDummyInput()
      .appendField('  説明')
      .appendField(new Blockly.FieldTextInput(''), 'DESCRIPTION');
  this.appendDummyInput()
      .appendField('  色(16進・#無し)')
      .appendField(new Blockly.FieldTextInput('4F46E5'), 'COLOR');
});
defineActionBlock('action_send_dm', COLOUR_ACTION, '対象ユーザーにDMを送ります（DMを許可していない場合は何も起きません）。' + TEMPLATE_HINT, function() {
  this.appendDummyInput()
      .appendField('✉ DM送信')
      .appendField(new Blockly.FieldTextInput('hi'), 'CONTENT');
});
defineActionBlock('action_send_to_channel', COLOUR_ACTION, '指定したチャンネルIDにメッセージを送信します。送信先チャンネルであなた自身とBotの両方に送信権限が必要です。' + TEMPLATE_HINT, function() {
  this.appendDummyInput()
      .appendField('📮 他chへ送信  channel_id:')
      .appendField(new Blockly.FieldTextInput('000000000000000000'), 'CHANNEL_ID');
  this.appendDummyInput()
      .appendField('  内容')
      .appendField(new Blockly.FieldTextInput('hi'), 'CONTENT');
});

/* ── メッセージ操作 ── */
defineActionBlock('action_add_reaction', COLOUR_ACTION, 'メッセージに絵文字リアクションを1つ付けます（メッセージ受信/リアクショントリガーのみ有効）。', function() {
  this.appendDummyInput()
      .appendField('😀 リアクション付与')
      .appendField(new Blockly.FieldTextInput('👍'), 'EMOJI');
});
defineActionBlock('action_add_multiple_reactions', COLOUR_ACTION, '複数の絵文字リアクションをまとめて付けます。スペース区切りで最大10個。', function() {
  this.appendDummyInput()
      .appendField('😀😆 複数リアクション付与')
      .appendField(new Blockly.FieldTextInput('👍 ❤️ 😆'), 'EMOJIS');
});
defineActionBlock('action_remove_all_reactions', COLOUR_ACTION, 'メッセージのリアクションをすべて削除します。', function() {
  this.appendDummyInput().appendField('🧹 リアクション全削除');
});
defineActionBlock('action_delete_message', COLOUR_ACTION, 'トリガーとなったメッセージを削除します。', function() {
  this.appendDummyInput().appendField('🗑 このメッセージを削除');
});
defineActionBlock('action_pin_message', COLOUR_ACTION, 'メッセージをピン留めします。', function() {
  this.appendDummyInput().appendField('📌 メッセージを固定');
});
defineActionBlock('action_unpin_message', COLOUR_ACTION, 'メッセージのピン留めを解除します。', function() {
  this.appendDummyInput().appendField('📌 固定を解除');
});

  this.appendDummyInput()
      .appendField('➕ ロール付与  role_id:')
      .appendField(new Blockly.FieldTextInput('000000000000000000'), 'ROLE_ID');
});
defineActionBlock('action_remove_role', COLOUR_ACTION, '対象ユーザーからロールを外します。', function() {
  this.appendDummyInput()
      .appendField('➖ ロール剥奪  role_id:')
      .appendField(new Blockly.FieldTextInput('000000000000000000'), 'ROLE_ID');
});
defineActionBlock('action_set_nickname', COLOUR_ACTION, '対象ユーザーのニックネームを変更します（空欄でリセット）。' + TEMPLATE_HINT, function() {
  this.appendDummyInput()
      .appendField('✏ ニックネーム変更')
      .appendField(new Blockly.FieldTextInput(''), 'NICKNAME');
});

/* ── チャンネル操作 ── */
defineActionBlock('action_create_thread', COLOUR_ACTION, 'トリガーとなったメッセージからスレッドを作成します（メッセージ受信/リアクショントリガーのみ有効）。' + TEMPLATE_HINT, function() {

});

const toolbox = {
  kind: 'categoryToolbox',
  contents: [
    { kind: 'category', name: 'トリガー', colour: COLOUR_TRIGGER,
      contents: [
        { kind: 'block', type: 'trigger_on_message' },
        { kind: 'block', type: 'trigger_on_member_join' },
        { kind: 'block', type: 'trigger_on_member_leave' },
        { kind: 'block', type: 'trigger_on_reaction_add' },
        { kind: 'block', type: 'trigger_on_voice_join' },
        { kind: 'block', type: 'trigger_on_voice_leave' },

// ══════════════════════════════════════════════
// トースト通知
// ══════════════════════════════════════════════
let toastTimer = null;
function showToast(msg, isErr) {
  const el = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  el.classList.toggle('err', !!isErr);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

// ══════════════════════════════════════════════
// Blockly → JSON シリアライズ
// ══════════════════════════════════════════════
function actionBlockToJson(block) {
  switch (block.type) {
    case 'action_delay':
      return { type: 'delay', ms: Number(block.getFieldValue('MS')) };
    case 'action_random_delay':
      return { type: 'random_delay', min_ms: Number(block.getFieldValue('MIN_MS')), max_ms: Number(block.getFieldValue('MAX_MS')) };
    case 'action_send_message':
      return { type: 'send_message', content: block.getFieldValue('CONTENT') };
    case 'action_reply':
      return { type: 'reply', content: block.getFieldValue('CONTENT') };
    case 'action_random_message':
      return { type: 'random_message', messages: block.getFieldValue('MESSAGES').split('|').map(s => s.trim()).filter(Boolean) };
    case 'action_send_embed': {
      const out = { type: 'send_embed' };
      const title = block.getFieldValue('TITLE'); if (title) out.title = title;
      const desc  = block.getFieldValue('DESCRIPTION'); if (desc) out.description = desc;
      const color = block.getFieldValue('COLOR'); if (color) out.color = color;
      return out;
    }
    case 'action_send_dm':
      return { type: 'send_dm', content: block.getFieldValue('CONTENT') };
    case 'action_send_to_channel':
      return { type: 'send_to_channel', channel_id: block.getFieldValue('CHANNEL_ID'), content: block.getFieldValue('CONTENT') };
    case 'action_add_reaction':
      return { type: 'add_reaction', emoji: block.getFieldValue('EMOJI') };
    case 'action_add_multiple_reactions':
      return { type: 'add_multiple_reactions', emojis: block.getFieldValue('EMOJIS').split(/\s+/).filter(Boolean) };
    case 'action_remove_all_reactions':
      return { type: 'remove_all_reactions' };
    case 'action_delete_message':
      return { type: 'delete_message' };
    case 'action_pin_message':
      return { type: 'pin_message' };
    case 'action_unpin_message':
      return { type: 'unpin_message' };
    case 'action_add_role':
      return { type: 'add_role', role_id: block.getFieldValue('ROLE_ID') };
    case 'action_remove_role':
      return { type: 'remove_role', role_id: block.getFieldValue('ROLE_ID') };
    case 'action_set_nickname':
      return { type: 'set_nickname', nickname: block.getFieldValue('NICKNAME') };
    case 'action_create_thread':
      return { type: 'create_thread', name: block.getFieldValue('NAME') };
    case 'action_set_channel_topic':
      return { type: 'set_channel_topic', topic: block.getFieldValue('TOPIC') };
    case 'action_set_slowmode':
      return { type: 'set_slowmode', seconds: Number(block.getFieldValue('SECONDS')) };
    case 'action_move_voice_channel':
      return { type: 'move_voice_channel', target_channel_id: block.getFieldValue('TARGET_CHANNEL_ID') };
    case 'action_disconnect_voice':
      return { type: 'disconnect_voice' };
    case 'action_set_voice_mute':
      return { type: 'set_voice_mute', mute: block.getFieldValue('MUTE') === 'true' };
    case 'action_set_voice_deafen':
      return { type: 'set_voice_deafen', deafen: block.getFieldValue('DEAFEN') === 'true' };
    case 'action_timeout':
      return { type: 'timeout', seconds: Number(block.getFieldValue('SECONDS')) };
    case 'action_remove_timeout':
      return { type: 'remove_timeout' };
    case 'action_kick':
      return { type: 'kick' };
    case 'action_ban':
      return { type: 'ban' };
    case 'action_rickroll':
      return { type: 'rickroll' };
    default:
      return null;
  }
}

function triggerBlockToJson(trigger) {
  switch (trigger.type) {
    case 'trigger_on_message': {
      const condType = trigger.getFieldValue('COND_TYPE');
      const condValue = trigger.getFieldValue('COND_VALUE');
      const condition = condType === 'any' ? { type: 'any' } : { type: condType, value: condValue || '' };
      let channelId = null;
      const chBlock = trigger.getInputTargetBlock('CHANNEL_ID');
      if (chBlock && chBlock.type === 'value_channel_id') {
        const raw = (chBlock.getFieldValue('ID') || '').trim();
        if (raw) channelId = raw;
      }
      return { type: 'on_message', channel_id: channelId, condition: condition };
    }
    case 'trigger_on_member_join':
      return { type: 'on_member_join', channel_id: trigger.getFieldValue('CHANNEL_ID').trim() };
    case 'trigger_on_member_leave':
      return { type: 'on_member_leave', channel_id: trigger.getFieldValue('CHANNEL_ID').trim() };
    case 'trigger_on_reaction_add': {
      const condType = trigger.getFieldValue('COND_TYPE');
      const condValue = trigger.getFieldValue('COND_VALUE');
      const condition = condType === 'any' ? { type: 'any' } : { type: condType, value: condValue || '' };
      let channelId = null;
      const chBlock = trigger.getInputTargetBlock('CHANNEL_ID');
      if (chBlock && chBlock.type === 'value_channel_id') {
        const raw = (chBlock.getFieldValue('ID') || '').trim();
        if (raw) channelId = raw;
      }
      return { type: 'on_reaction_add', channel_id: channelId, condition: condition };
    }
    case 'trigger_on_voice_join':
    case 'trigger_on_voice_leave': {
      const out = {
        type: trigger.type === 'trigger_on_voice_join' ? 'on_voice_join' : 'on_voice_leave',
        channel_id: trigger.getFieldValue('CHANNEL_ID').trim(),
      };
      const vch = (trigger.getFieldValue('VOICE_CHANNEL_ID') || '').trim();
      if (vch) out.voice_channel_id = vch;
      return out;
    }
    default:
      return null;
  }
}

function buildScriptJson() {
  const allTriggerTypes = TRIGGER_TYPES.map(t => t[0]);
  const triggerBlocks = workspace.getTopBlocks(true).filter(b => allTriggerTypes.includes(b.type));
  if (triggerBlocks.length === 0) {
    throw new Error('トリガーブロックが見つかりません。「トリガー」カテゴリからブロックを配置してください。');
  }
  if (triggerBlocks.length > 1) {
    throw new Error('トリガーブロックは1つだけ配置してください（現在 ' + triggerBlocks.length + ' 個あります）。');
  }
  const triggerBlock = triggerBlocks[0];
  const trigger = triggerBlockToJson(triggerBlock);
  if (!trigger) {
    throw new Error('トリガーの内容を読み取れませんでした。');
  }

  const actions = [];
  let cur = triggerBlock.getInputTargetBlock('ACTIONS');
  while (cur) {
    const a = actionBlockToJson(cur);
    if (a) actions.push(a);
    cur = cur.getNextBlock();
  }
  if (actions.length === 0) {
    throw new Error('アクションが1つもありません。「実行するアクション」の中にブロックを繋げてください。');
  }
  if (actions.length > 20) {
    throw new Error('アクション数は最大20個までです（現在 ' + actions.length + ' 個）。');
  }

  const name = (document.getElementById('scriptName').value || 'スクリプト').trim().slice(0, 50);

  return { version: '1.1', name: name, trigger: trigger, actions: actions };
}

document.getElementById('btnDownload').addEventListener('click', () => {
  let json;
  try {
    json = buildScriptJson();
  } catch (e) {
    showToast(e.message, true);
    return;
  }
  const blob = new Blob([JSON.stringify(json, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeName = json.name.replace(/[\\/:*?"<>|]/g, '_') || 'script';
  a.href = url;
  a.download = safeName + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('ダウンロードしました：' + safeName + '.json');
});

document.getElementById('btnClear').addEventListener('click', () => {
  if (!confirm('ワークスペースをすべてクリアしますか？')) return;
  workspace.clear();
  const b = workspace.newBlock('trigger_on_message');
  b.initSvg(); b.render();
  b.moveBy(40, 40);
  showToast('クリアしました');
});

// ══════════════════════════════════════════════
// JSON → Blockly 復元（既存スクリプトの再編集用。旧バージョンのスクリプトもそのまま読み込める）
// ══════════════════════════════════════════════
const ACTION_JSON_TO_BLOCK = {
  delay:        (a) => ({ type: 'action_delay', fields: { MS: a.ms ?? 1000 } }),
  random_delay: (a) => ({ type: 'action_random_delay', fields: { MIN_MS: a.min_ms ?? 500, MAX_MS: a.max_ms ?? 2000 } }),
  send_message: (a) => ({ type: 'action_send_message', fields: { CONTENT: a.content ?? '' } }),
  reply:        (a) => ({ type: 'action_reply', fields: { CONTENT: a.content ?? '' } }),
  random_message: (a) => ({ type: 'action_random_message', fields: { MESSAGES: (a.messages ?? ['']).join('|') } }),
  send_embed:   (a) => ({ type: 'action_send_embed', fields: { TITLE: a.title ?? '', DESCRIPTION: a.description ?? '', COLOR: a.color ?? '4F46E5' } }),
  send_dm:      (a) => ({ type: 'action_send_dm', fields: { CONTENT: a.content ?? '' } }),
  send_to_channel: (a) => ({ type: 'action_send_to_channel', fields: { CHANNEL_ID: String(a.channel_id ?? ''), CONTENT: a.content ?? '' } }),
  add_reaction: (a) => ({ type: 'action_add_reaction', fields: { EMOJI: a.emoji ?? '👍' } }),
  add_multiple_reactions: (a) => ({ type: 'action_add_multiple_reactions', fields: { EMOJIS: (a.emojis ?? ['👍']).join(' ') } }),
  remove_all_reactions: () => ({ type: 'action_remove_all_reactions', fields: {} }),
  delete_message: () => ({ type: 'action_delete_message', fields: {} }),
  pin_message:   () => ({ type: 'action_pin_message', fields: {} }),
  unpin_message: () => ({ type: 'action_unpin_message', fields: {} }),
  add_role:      (a) => ({ type: 'action_add_role', fields: { ROLE_ID: String(a.role_id ?? '') } }),
  remove_role:   (a) => ({ type: 'action_remove_role', fields: { ROLE_ID: String(a.role_id ?? '') } }),
  set_nickname:  (a) => ({ type: 'action_set_nickname', fields: { NICKNAME: a.nickname ?? '' } }),
  create_thread: (a) => ({ type: 'action_create_thread', fields: { NAME: a.name ?? '' } }),
  set_channel_topic: (a) => ({ type: 'action_set_channel_topic', fields: { TOPIC: a.topic ?? '' } }),
  set_slowmode:  (a) => ({ type: 'action_set_slowmode', fields: { SECONDS: a.seconds ?? 5 } }),
  move_voice_channel: (a) => ({ type: 'action_move_voice_channel', fields: { TARGET_CHANNEL_ID: String(a.target_channel_id ?? '') } }),
  disconnect_voice:   () => ({ type: 'action_disconnect_voice', fields: {} }),
  set_voice_mute:   (a) => ({ type: 'action_set_voice_mute', fields: { MUTE: a.mute ? 'true' : 'false' } }),
  set_voice_deafen: (a) => ({ type: 'action_set_voice_deafen', fields: { DEAFEN: a.deafen ? 'true' : 'false' } }),
  timeout:       (a) => ({ type: 'action_timeout', fields: { SECONDS: a.seconds ?? 60 } }),
  remove_timeout:() => ({ type: 'action_remove_timeout', fields: {} }),
  kick:          () => ({ type: 'action_kick', fields: {} }),
  ban:           () => ({ type: 'action_ban', fields: {} }),
  rickroll:      () => ({ type: 'action_rickroll', fields: {} }),
};

function actionJsonToBlock(action) {
  const mapper = ACTION_JSON_TO_BLOCK[action.type];
  if (!mapper) return null;
  const spec = mapper(action);
  const block = workspace.newBlock(spec.type);
  for (const [field, value] of Object.entries(spec.fields)) {
    block.setFieldValue(String(value), field);
  }
  block.initSvg();
  block.render();
  return block;
}

function buildTriggerBlock(trigger) {
  // trigger.type が未知/未指定の場合も「メッセージ受信」として安全にフォールバックする（後方互換）
  const ttype = trigger.type || 'on_message';
  let block;

  if (ttype === 'on_member_join' || ttype === 'on_member_leave') {
    block = workspace.newBlock(ttype === 'on_member_join' ? 'trigger_on_member_join' : 'trigger_on_member_leave');
    block.initSvg(); block.render();
    block.setFieldValue(String(trigger.channel_id ?? ''), 'CHANNEL_ID');
    return block;
  }

  if (ttype === 'on_voice_join' || ttype === 'on_voice_leave') {
    block = workspace.newBlock(ttype === 'on_voice_join' ? 'trigger_on_voice_join' : 'trigger_on_voice_leave');
    block.initSvg(); block.render();
    block.setFieldValue(String(trigger.channel_id ?? ''), 'CHANNEL_ID');
    if (trigger.voice_channel_id) block.setFieldValue(String(trigger.voice_channel_id), 'VOICE_CHANNEL_ID');
    return block;
  }

  // on_message / on_reaction_add / 不明タイプ → メッセージ受信 or リアクション追加として復元
  block = workspace.newBlock(ttype === 'on_reaction_add' ? 'trigger_on_reaction_add' : 'trigger_on_message');
  block.initSvg(); block.render();

  const cond = trigger.condition || { type: 'any' };
  block.setFieldValue(cond.type || 'any', 'COND_TYPE');
  if (cond.value) block.setFieldValue(String(cond.value), 'COND_VALUE');

  if (trigger.channel_id) {
    const chBlock = workspace.newBlock('value_channel_id');
    chBlock.initSvg(); chBlock.render();
    chBlock.setFieldValue(String(trigger.channel_id), 'ID');
    block.getInput('CHANNEL_ID').connection.connect(chBlock.outputConnection);
  }
  return block;
}

function loadScriptJson(json) {
  if (!json || typeof json !== 'object' || !json.trigger || !Array.isArray(json.actions)) {
    throw new Error('このJSONは対応フォーマットではありません（trigger / actions が必要です）。');
  }
  workspace.clear();

  document.getElementById('scriptName').value = json.name || 'スクリプト';

  const trigger = buildTriggerBlock(json.trigger);
  trigger.moveBy(40, 40);

  let prevConn = trigger.getInput('ACTIONS').connection;
  for (const action of json.actions) {
    const b = actionJsonToBlock(action);
    if (!b) continue;  // 未知のアクション種別はスキップ（将来バージョンとの前方互換のため落とさない）
    prevConn.connect(b.previousConnection);
    prevConn = b.nextConnection;
  }

  Blockly.svgResize(workspace);
}

document.getElementById('btnLoad').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});

document.getElementById('fileInput').addEventListener('change', (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const json = JSON.parse(reader.result);
      loadScriptJson(json);
      showToast('読み込みました：' + file.name);
    } catch (e) {
      showToast('読み込みに失敗しました: ' + e.message, true);
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
});

window.addEventListener('resize', () => Blockly.svgResize(workspace));
